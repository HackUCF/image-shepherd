name: Image Shepherd Update Cron
on:
  workflow_dispatch:
  schedule:
    - cron: 0 8 1,15 * * # Approximation of 2 weeks at 3:00AM EST

# Overlapping runs both see no current image and both upload, producing duplicates.
concurrency:
  group: image-shepherd
  cancel-in-progress: false

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
      - name: Create clouds.yaml from secret
        run: |
          echo "${{ secrets.CLOUDS_YAML }}" > clouds.yaml
          chmod 644 clouds.yaml
      - name: Run Docker
        run: docker run --rm --pull always -v $PWD/clouds.yaml:/opt/image-shepherd/clouds.yaml -v $PWD/images.yaml:/opt/image-shepherd/images.yaml ghcr.io/hackucf/image-shepherd -no-color -verbose -require-public -require-protected -upload-timeout 3600
